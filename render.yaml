services:
  - type: web
    name: careerpilot-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careerpilot-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_CONTENT_LENGTH
        value: "8388608"
databases:
  - name: careerpilot-db
    databaseName: careerpilot
    user: careerpilot
