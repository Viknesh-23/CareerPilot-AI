{% extends 'base.html' %}{% block title %}Mock interview · CareerPilot AI{% endblock %}{% block content %}
<div class="mock-shell"><div class="d-flex justify-content-between text-muted small mb-2"><span>{{ question.category }}</span><span>Question {{ position }} of {{ total }}</span></div><div class="progress mb-4"><div class="progress-bar" style="width:{{ position / total * 100 }}%"></div></div><div class="panel"><h1 class="h4 mb-4">{{ question.prompt }}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="position" value="{{ position }}"><label class="form-label">Your answer</label><textarea class="form-control" name="answer" rows="10" placeholder="Structure your response clearly and include a concrete example." required></textarea><div class="d-flex justify-content-between align-items-center mt-3"><span class="text-muted small">Your answer is evaluated as you progress.</span><button class="btn btn-primary">Submit answer <i class="bi bi-arrow-right"></i></button></div></form></div></div>
{% endblock %}
