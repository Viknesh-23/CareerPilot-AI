{% extends 'base.html' %}{% block title %}Create account · CareerPilot AI{% endblock %}{% block content %}
<div class="auth-card"><div class="text-center mb-4"><div class="auth-logo"><i class="bi bi-rocket-takeoff-fill"></i></div><h1>Start your career journey</h1><p class="text-muted">Track applications, prepare better, and learn what to improve.</p></div>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="full_name" required></div><div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" required><div class="form-text">At least 8 characters.</div></div><div class="mb-4"><label class="form-label">Confirm password</label><input class="form-control" type="password" name="confirm_password" minlength="8" required></div><button class="btn btn-primary w-100">Create account</button></form><p class="text-center mt-4 mb-0">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p></div>
{% endblock %}
