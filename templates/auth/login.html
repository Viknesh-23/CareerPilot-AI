{% extends 'base.html' %}{% block title %}Sign in · CareerPilot AI{% endblock %}{% block content %}
<div class="auth-card"><div class="text-center mb-4"><div class="auth-logo"><i class="bi bi-rocket-takeoff-fill"></i></div><h1>Welcome back</h1><p class="text-muted">Continue building your career momentum.</p></div>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required autofocus></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div><div class="form-check mb-4"><input class="form-check-input" type="checkbox" name="remember" id="remember"><label class="form-check-label" for="remember">Keep me signed in</label></div><button class="btn btn-primary w-100">Sign in</button></form><p class="text-center mt-4 mb-0">New to CareerPilot? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div>
{% endblock %}
